<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Code Authorship Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      width: 380px;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      background: #1e293b;
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #f8fafc;
    }

    header .badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #334155;
      color: #94a3b8;
    }

    #status {
      padding: 14px 16px;
      color: #94a3b8;
      font-size: 12px;
    }

    #results { padding: 0 0 12px; }

    .verdict {
      margin: 12px 16px;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
    }
    .verdict.clean { background: #052e16; color: #4ade80; border: 1px solid #166534; }
    .verdict.flagged { background: #450a0a; color: #f87171; border: 1px solid #991b1b; }
    .verdict.uncertain { background: #1c1917; color: #fb923c; border: 1px solid #92400e; }

    .section {
      margin: 0 16px 10px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #64748b;
      margin-bottom: 6px;
    }

    .item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 5px;
    }

    .item .name {
      font-weight: 600;
      color: #f1f5f9;
      font-size: 12px;
    }

    .item .detail {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 3px;
      word-break: break-all;
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      margin-right: 3px;
      margin-top: 3px;
    }
    .tag.author { background: #312e81; color: #a5b4fc; }
    .tag.library { background: #1e3a5f; color: #93c5fd; }
    .tag.license { background: #3b1a1a; color: #fca5a5; }
    .tag.cdn { background: #1a3a2a; color: #86efac; }
    .tag.platform { background: #2d1a3a; color: #d8b4fe; }

    #scan-btn {
      display: block;
      width: calc(100% - 32px);
      margin: 12px 16px 4px;
      padding: 9px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #scan-btn:hover { background: #2563eb; }
    #scan-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

    .empty { color: #475569; font-size: 12px; padding: 4px 0; }
  </style>
</head>
<body>
  <header>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <h1>Code Authorship Analyzer</h1>
    <span class="badge" id="url-badge">—</span>
  </header>

  <div id="status">Click "Analyze Page" to scan the current page.</div>
  <div id="results" style="display:none"></div>

  <button id="scan-btn">Analyze Page</button>

  <script src="popup.js"></script>
</body>
</html>
